<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Clock & Exam Countdown</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e3a8a);

    padding:20px;

}

.container{

    width:100%;
    max-width:850px;

    background:rgba(255,255,255,.1);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    padding:40px;

    color:white;

    box-shadow:0 20px 50px rgba(0,0,0,.3);

}

h1{

    text-align:center;

    margin-bottom:35px;

    font-size:32px;

}

.clock-section{

    text-align:center;

    margin-bottom:40px;

}

.clock{

    font-size:65px;

    font-weight:bold;

    letter-spacing:4px;

    color:#38bdf8;

    text-shadow:0 0 20px rgba(56,189,248,.5);

}

.date{

    margin-top:10px;

    font-size:18px;

    color:#cbd5e1;

}

.divider{

    height:1px;

    background:rgba(255,255,255,.2);

    margin:30px 0;

}

.countdown-section{

    text-align:center;

}

.countdown-section h2{

    margin-bottom:25px;

    color:#f8fafc;

}

.timer{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

}

.time-box{

    background:rgba(255,255,255,.12);

    padding:20px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,.15);

}

.time-box span{

    display:block;

    font-size:40px;

    font-weight:bold;

    color:#60a5fa;

}

.time-box p{

    margin-top:5px;

    color:#cbd5e1;

}

.message{

    margin-top:25px;

    font-size:20px;

    font-weight:bold;

    color:#fbbf24;

}

@media(max-width:600px){

    .container{

        padding:25px;

    }

    h1{

        font-size:25px;

    }

    .clock{

        font-size:42px;

    }

    .timer{

        grid-template-columns:repeat(2,1fr);

    }

    .time-box span{

        font-size:30px;

    }

}

</style>

</head>

<body>


<div class="container">

    <h1>🕒 Digital Clock & Exam Timer</h1>


    <!-- Digital Clock -->

    <div class="clock-section">

        <div class="clock" id="clock">

            00:00:00

        </div>

        <div class="date" id="date">

            Loading...

        </div>

    </div>


    <div class="divider"></div>


    <!-- Countdown -->

    <div class="countdown-section">

        <h2>📚 Examination Countdown</h2>

        <div class="timer">

            <div class="time-box">

                <span id="days">00</span>

                <p>Days</p>

            </div>

            <div class="time-box">

                <span id="hours">00</span>

                <p>Hours</p>

            </div>

            <div class="time-box">

                <span id="minutes">00</span>

                <p>Minutes</p>

            </div>

            <div class="time-box">

                <span id="seconds">00</span>

                <p>Seconds</p>

            </div>

        </div>

        <div class="message" id="message">

            Time remaining for examination

        </div>

    </div>

</div>


<script>

/* ---------------- DIGITAL CLOCK ---------------- */

function updateClock(){

    // Create Date object

    let now = new Date();


    let hours = now.getHours();

    let minutes = now.getMinutes();

    let seconds = now.getSeconds();


    // Add leading zero

    hours = String(hours).padStart(2,'0');

    minutes = String(minutes).padStart(2,'0');

    seconds = String(seconds).padStart(2,'0');


    // Update clock

    document.getElementById("clock").textContent =

        hours + ":" + minutes + ":" + seconds;


    // Get date

    let date = now.toDateString();


    document.getElementById("date").textContent = date;

}


/* ---------------- COUNTDOWN ---------------- */

// Set examination date

let examDate = new Date("December 15, 2026 09:00:00");


function updateCountdown(){

    let now = new Date();


    // Difference in milliseconds

    let difference = examDate - now;


    if(difference <= 0){

        document.getElementById("days").textContent = "00";

        document.getElementById("hours").textContent = "00";

        document.getElementById("minutes").textContent = "00";

        document.getElementById("seconds").textContent = "00";

        document.getElementById("message").textContent =
            "🎉 Examination Time!";

        return;

    }


    // Convert milliseconds

    let days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    let hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
    );

    let minutes = Math.floor(
        (difference / (1000 * 60)) % 60
    );

    let seconds = Math.floor(
        (difference / 1000) % 60
    );


    // Update DOM

    document.getElementById("days").textContent =
        String(days).padStart(2,'0');

    document.getElementById("hours").textContent =
        String(hours).padStart(2,'0');

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2,'0');

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2,'0');

}


/* ---------------- UPDATE EVERY SECOND ---------------- */

updateClock();

updateCountdown();


setInterval(function(){

    updateClock();

    updateCountdown();

},1000);

</script>

</body>

</html>
