<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic To-Do List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #addBtn:hover {
            background: #5568d9;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f6ff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #667eea;
        }

        .task-text {
            flex: 1;
            margin-left: 10px;
            color: #333;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .actions button {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .complete {
            background: #28a745;
        }

        .edit {
            background: #f0ad4e;
        }

        .delete {
            background: #dc3545;
        }

        .actions button:hover {
            opacity: 0.8;
        }

        .count {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .input-box {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }

            li {
                flex-wrap: wrap;
                gap: 10px;
            }

            .actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 To-Do List</h1>

    <div class="input-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >

        <button id="addBtn" onclick="addTask()">
            Add Task
        </button>

    </div>

    <ul id="taskList"></ul>

    <div class="count">
        Total Tasks: <span id="taskCount">0</span>
    </div>

</div>


<script>

    // Array to store task objects
    let tasks = [];

    // Add Task
    function addTask() {

        let input = document.getElementById("taskInput");
        let taskText = input.value.trim();

        if (taskText === "") {
            alert("Please enter a task");
            return;
        }

        let task = {
            id: Date.now(),
            text: taskText,
            completed: false
        };

        tasks.push(task);

        input.value = "";

        displayTasks();
    }


    // Display Tasks
    function displayTasks() {

        let list = document.getElementById("taskList");

        list.innerHTML = "";

        for (let i = 0; i < tasks.length; i++) {

            let task = tasks[i];

            let li = document.createElement("li");

            if (task.completed) {
                li.classList.add("completed");
            }

            li.innerHTML = `

                <input type="checkbox"
                    ${task.completed ? "checked" : ""}
                    onchange="toggleTask(${task.id})">

                <span class="task-text">
                    ${task.text}
                </span>

                <div class="actions">

                    <button class="complete"
                        onclick="toggleTask(${task.id})">
                        ✓
                    </button>

                    <button class="edit"
                        onclick="editTask(${task.id})">
                        Edit
                    </button>

                    <button class="delete"
                        onclick="deleteTask(${task.id})">
                        Delete
                    </button>

                </div>
            `;

            list.appendChild(li);
        }

        document.getElementById("taskCount").textContent =
            tasks.length;
    }


    // Complete / Uncomplete Task
    function toggleTask(id) {

        for (let i = 0; i < tasks.length; i++) {

            if (tasks[i].id === id) {

                tasks[i].completed =
                    !tasks[i].completed;

                break;
            }
        }

        displayTasks();
    }


    // Edit Task
    function editTask(id) {

        for (let i = 0; i < tasks.length; i++) {

            if (tasks[i].id === id) {

                let newText = prompt(
                    "Edit task:",
                    tasks[i].text
                );

                if (newText !== null &&
                    newText.trim() !== "") {

                    tasks[i].text =
                        newText.trim();
                }

                break;
            }
        }

        displayTasks();
    }


    // Delete Task
    function deleteTask(id) {

        if (!confirm("Delete this task?")) {
            return;
        }

        tasks = tasks.filter(function(task) {
            return task.id !== id;
        });

        displayTasks();
    }


    // Enter key support
    document.getElementById("taskInput")
        .addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        });

</script>

</body>
</html>
