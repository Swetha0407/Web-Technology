<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Result Analysis System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(135deg,#1e3c72,#2a5298);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;

}

.container{

width:100%;
max-width:900px;
background:#fff;
border-radius:20px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.35);

}

h1{

text-align:center;
margin-bottom:25px;
color:#1e3c72;

}

.form-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;

}

.input-group{

display:flex;
flex-direction:column;

}

label{

font-weight:bold;
margin-bottom:6px;
color:#333;

}

input{

padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
transition:.3s;

}

input:focus{

outline:none;
border-color:#1e88e5;
box-shadow:0 0 8px rgba(30,136,229,.3);

}

.subjects{

margin-top:25px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;

}

.buttons{

margin-top:30px;
display:flex;
justify-content:center;
gap:20px;

}

button{

padding:14px 28px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;

}

#analyze{

background:#1e88e5;
color:white;

}

#analyze:hover{

background:#1565c0;
transform:translateY(-2px);

}

#reset{

background:#e53935;
color:white;

}

#reset:hover{

background:#c62828;
transform:translateY(-2px);

}

.result-card{

display:none;
margin-top:35px;
padding:25px;
background:#f7fbff;
border-radius:15px;
border:2px solid #d6e9ff;

}

.result-card h2{

text-align:center;
color:#1e3c72;
margin-bottom:20px;

}

.summary{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:25px;

}

.summary div{

background:white;
padding:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
font-weight:bold;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

table th{

background:#1e88e5;
color:white;
padding:14px;

}

table td{

padding:12px;
text-align:center;
border-bottom:1px solid #ddd;

}

table tr:nth-child(even){

background:#f2f8ff;

}

table tr:hover{

background:#e3f2fd;

}

.progress{

height:18px;
background:#ddd;
border-radius:10px;
overflow:hidden;

}

.progress-bar{

height:100%;
background:linear-gradient(90deg,#42a5f5,#1e88e5);
color:white;
font-size:12px;
text-align:center;

}

.pass{

color:green;
font-weight:bold;

}

.fail{

color:red;
font-weight:bold;

}

.high{

background:#d4edda !important;

}

.low{

background:#f8d7da !important;

}

@media(max-width:700px){

.form-grid,
.subjects,
.summary{

grid-template-columns:1fr;

}

.container{

padding:20px;

}

button{

width:100%;

}

.buttons{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="container">

<h1>Student Result Analysis System</h1>

<div class="form-grid">

<div class="input-group">
<label>Student Name</label>
<input type="text" id="name">
</div>

<div class="input-group">
<label>Register Number</label>
<input type="text" id="regno">
</div>

</div>

<div class="subjects">

<div class="input-group">
<label>English</label>
<input type="number" id="eng">
</div>

<div class="input-group">
<label>Mathematics</label>
<input type="number" id="math">
</div>

<div class="input-group">
<label>Science</label>
<input type="number" id="science">
</div>

<div class="input-group">
<label>Computer</label>
<input type="number" id="computer">
</div>

<div class="input-group">
<label>Social</label>
<input type="number" id="social">
</div>

</div>

<div class="buttons">

<button id="analyze" onclick="analyzeResult()">Analyze Result</button>

<button id="reset" onclick="location.reload()">Reset</button>

</div>

<div class="result-card" id="resultCard">

<h2>Result Summary</h2>

<div class="summary">

<div>Name :
<span id="sname"></span>
</div>

<div>Register No :
<span id="sreg"></span>
</div>

<div>Total :
<span id="total"></span>
</div>

<div>Average :
<span id="average"></span>
</div>

<div>Percentage :
<span id="percentage"></span>
</div>

<div>Highest :
<span id="highest"></span>
</div>

<div>Lowest :
<span id="lowest"></span>
</div>

<div>Grade :
<span id="grade"></span>
</div>

<div>Result :
<span id="result"></span>
</div>

</div>

<table>

<thead>

<tr>

<th>Subject</th>

<th>Marks</th>

<th>Progress</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script>
const subjects = [
"English",
"Mathematics",
"Science",
"Computer",
"Social"
];

function analyzeResult(){

let name=document.getElementById("name").value;
let reg=document.getElementById("regno").value;

let marks=[
Number(document.getElementById("eng").value),
Number(document.getElementById("math").value),
Number(document.getElementById("science").value),
Number(document.getElementById("computer").value),
Number(document.getElementById("social").value)
];

if(name=="" || reg==""){

alert("Please enter Student Details");
return;

}

for(let i=0;i<marks.length;i++){

if(marks[i]<0 || marks[i]>100 || isNaN(marks[i])){

alert("Enter valid marks between 0 and 100");
return;

}

}

let student={

name:name,
register:reg,
marks:marks

};

let total=0;

for(let i=0;i<student.marks.length;i++){

total+=student.marks[i];

}

let average=(total/student.marks.length).toFixed(2);
let percentage=average;

let highest=Math.max(...student.marks);
let lowest=Math.min(...student.marks);

let grade="";

if(average>=90)
grade="A+";
else if(average>=80)
grade="A";
else if(average>=70)
grade="B";
else if(average>=60)
grade="C";
else if(average>=50)
grade="D";
else
grade="F";

let result=(lowest>=35)?"PASS":"FAIL";

document.getElementById("resultCard").style.display="block";

document.getElementById("sname").innerHTML=student.name;
document.getElementById("sreg").innerHTML=student.register;
document.getElementById("total").innerHTML=total;
document.getElementById("average").innerHTML=average;
document.getElementById("percentage").innerHTML=percentage+"%";
document.getElementById("highest").innerHTML=highest;
document.getElementById("lowest").innerHTML=lowest;
document.getElementById("grade").innerHTML=grade;

let resultSpan=document.getElementById("result");

resultSpan.innerHTML=result;

if(result=="PASS")
resultSpan.className="pass";
else
resultSpan.className="fail";

let table="";

for(let i=0;i<subjects.length;i++){

let cls="";

if(student.marks[i]==highest)
cls="high";

if(student.marks[i]==lowest)
cls="low";

table+=`

<tr class="${cls}">

<td>${subjects[i]}</td>

<td>${student.marks[i]}</td>

<td>

<div class="progress">

<div class="progress-bar"
style="width:${student.marks[i]}%">

${student.marks[i]}%

</div>

</div>

</td>

</tr>

`;

}

document.getElementById("tableBody").innerHTML=table;

}

</script>

</body>

</html>
