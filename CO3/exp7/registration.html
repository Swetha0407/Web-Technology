<!DOCTYPE html>
<html>
<head>

    <title>Student Registration</title>

    <style>

        body {
            font-family: Arial;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #aaa;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <form action="StudentRegistrationServlet" method="post">

        <label>Student Name</label>
        <input type="text" name="name">

        <label>Register Number</label>
        <input type="text" name="regno">

        <label>Email</label>
        <input type="email" name="email">

        <label>Department</label>

        <select name="department">

            <option value="">Select Department</option>
            <option>IT</option>
            <option>BE Computer Science</option>
            <option>B.Com</option>
            <option>BBA</option>
            <option>MCA</option>

        </select>

        <label>Semester</label>

        <select name="semester">

            <option value="">Select Semester</option>
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
            <option>Semester 5</option>
            <option>Semester 6</option>

        </select>

        <button type="submit">
            Register Student
        </button>

    </form>

</div>

</body>
</html>
