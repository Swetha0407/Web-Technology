<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Student Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background:
                radial-gradient(circle at top left, #8b5cf6, transparent 35%),
                radial-gradient(circle at bottom right, #c084fc, transparent 35%),
                #2e1065;
        }

        .container {
            width: 100%;
            max-width: 900px;

            background: rgba(255,255,255,0.97);

            padding: 35px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(30,10,70,0.45);
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: auto;
            margin-bottom: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #a855f7
            );

            color: white;

            font-size: 30px;

            box-shadow:
                0 10px 25px rgba(124,58,237,0.35);
        }

        h1 {
            color: #3b0764;
            font-size: 32px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #7c3aed;
            font-size: 15px;
        }

        /* CONTENT */

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        /* PROFILE */

        #profile {
            padding: 30px;

            border-radius: 18px;

            background: linear-gradient(
                145deg,
                #4c1d95,
                #6d28d9,
                #7e22ce
            );

            color: white;

            box-shadow:
                0 15px 35px rgba(76,29,149,0.3);

            transition: 0.3s;
        }

        #profile:hover {
            transform: translateY(-5px);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 18px;

            margin-bottom: 25px;
        }

        .avatar {
            width: 65px;
            height: 65px;

            border-radius: 50%;

            background: #ede9fe;
            color: #6d28d9;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: bold;
        }

        .profile-label {
            color: #ddd6fe;
            font-size: 13px;
        }

        #studentName {
            font-size: 24px;
        }

        #details {
            line-height: 2;
            margin-bottom: 20px;
        }

        #profileLink {
            display: inline-block;

            padding: 9px 15px;

            border-radius: 8px;

            background: #ede9fe;
            color: #6d28d9;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        #profileLink:hover {
            background: white;
            transform: translateY(-2px);
        }

        /* CONTROLS */

        .controls {
            padding: 25px;

            background: #faf5ff;

            border: 1px solid #e9d5ff;

            border-radius: 18px;
        }

        .controls h2 {
            color: #4c1d95;

            margin-bottom: 20px;

            font-size: 21px;
        }

        .control-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            color: #581c87;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;

            padding: 11px 13px;

            border: 1px solid #d8b4fe;

            border-radius: 9px;

            background: white;

            color: #3b0764;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139,92,246,0.15);
        }

        button {
            width: 100%;

            padding: 11px;

            border: none;

            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #6d28d9,
                #9333ea
            );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(109,40,217,0.3);
        }

        .button-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 10px;
        }

        #hideBtn {
            background: #4c1d95;
        }

        /* HIGHLIGHT CLASS */

        .highlight {
            border: 3px solid #f59e0b !important;

            box-shadow:
                0 0 18px rgba(245,158,11,0.45);
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .container {
                padding: 22px;
            }

            .content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 27px;
            }

        }

        @media (max-width: 450px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 18px;
            }

            #profile {
                padding: 22px;
            }

            .button-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="icon">
            🎓
        </div>

        <h1 id="heading">
            Student Profile
        </h1>

        <p class="subtitle">
            DOM-Based Profile Manipulation
        </p>

    </div>


    <div class="content">

        <!-- STUDENT PROFILE -->

        <div id="profile">

            <div class="profile-top">

                <div class="avatar">
                    SS
                </div>

                <div>

                    <p class="profile-label">
                        STUDENT
                    </p>

                    <h2 id="studentName">
                        Swetha S
                    </h2>

                </div>

            </div>


            <p id="details">

                <strong>Register No:</strong>
                192521076

                <br>

                <strong>Department:</strong>
                IT

                <br>

                <strong>Year:</strong>
                II Year

            </p>


            <a
                id="profileLink"
                href="https://www.google.com"
                target="_blank"
            >
                View Student Profile →
            </a>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <h2>⚙ Profile Controls</h2>


            <!-- HEADING -->

            <div class="control-group">

                <label>
                    Change Heading
                </label>

                <input
                    type="text"
                    id="headingInput"
                    placeholder="Enter new heading"
                >

            </div>


            <div class="control-group">

                <button id="headingBtn">
                    Change Heading
                </button>

            </div>


            <!-- TEXT COLOUR -->

            <div class="control-group">

                <label>
                    Text Colour
                </label>

                <select id="textColor">

                    <option value="#ffffff">
                        White
                    </option>

                    <option value="#ff4d4d">
                        Red
                    </option>

                    <option value="#00e676">
                        Green
                    </option>

                    <option value="#00bfff">
                        Blue
                    </option>

                    <option value="#ffd166">
                        Yellow
                    </option>

                    <option value="#ff8c42">
                        Orange
                    </option>

                    <option value="#ff69b4">
                        Pink
                    </option>

                </select>

            </div>


            <div class="control-group">

                <button id="textBtn">
                    Change Text Colour
                </button>

            </div>


            <!-- BACKGROUND COLOUR -->

            <div class="control-group">

                <label>
                    Background Colour
                </label>

                <select id="bgColor">

                    <option value="#4c1d95">
                        Deep Purple
                    </option>

                    <option value="#dc2626">
                        Red
                    </option>

                    <option value="#2563eb">
                        Blue
                    </option>

                    <option value="#15803d">
                        Green
                    </option>

                    <option value="#ea580c">
                        Orange
                    </option>

                    <option value="#be185d">
                        Pink
                    </option>

                    <option value="#0891b2">
                        Cyan
                    </option>

                </select>

            </div>


            <div class="control-group">

                <button id="bgBtn">
                    Change Background
                </button>

            </div>


            <!-- SHOW / HIDE -->

            <div class="button-row">

                <button id="showBtn">
                    Show Profile
                </button>

                <button id="hideBtn">
                    Hide Profile
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    /* ==================================
       DOM ELEMENT SELECTION
       ================================== */

    // getElementById()

    const heading =
        document.getElementById("heading");

    const profile =
        document.getElementById("profile");


    /* ==================================
       CHANGE HEADING
       ================================== */

    document
        .getElementById("headingBtn")
        .addEventListener("click", function() {

            const newHeading =
                document.getElementById("headingInput").value;

            if (newHeading !== "") {

                heading.textContent = newHeading;

            } else {

                alert("Please enter a heading.");

            }

        });


    /* ==================================
       CHANGE TEXT COLOUR
       ================================== */

    document
        .getElementById("textBtn")
        .addEventListener("click", function() {

            const color =
                document.getElementById("textColor").value;

            profile.style.color = color;

        });


    /* ==================================
       CHANGE BACKGROUND COLOUR
       ================================== */

    document
        .getElementById("bgBtn")
        .addEventListener("click", function() {

            const color =
                document.getElementById("bgColor").value;

            profile.style.background = color;

        });


    /* ==================================
       HIDE PROFILE
       ================================== */

    document
        .getElementById("hideBtn")
        .addEventListener("click", function() {

            profile.style.display = "none";

        });


    /* ==================================
       SHOW PROFILE
       ================================== */

    document
        .getElementById("showBtn")
        .addEventListener("click", function() {

            profile.style.display = "block";

        });


    /* ==================================
       querySelector()
       ================================== */

    const studentName =
        document.querySelector("#studentName");


    /* ==================================
       textContent
       ================================== */

    studentName.textContent = "Swetha S";


    /* ==================================
       classList
       ================================== */

    profile.classList.add("highlight");


    /* ==================================
       setAttribute()
       ================================== */

    const profileLink =
        document.getElementById("profileLink");

    profileLink.setAttribute(
        "title",
        "Open Student Profile"
    );

</script>

</body>

</html>
