<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }
        h1{
            color: darkblue;
        }
        img{
            border: 3px solid navy;
            border-radius: 10px;
        }
        iframe{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>Images, Hyperlinks and Iframes</h1>
    <h2>Image</h2>
    <img src="flower.avif"
         alt="Beautiful Flower"
         width="300"
         height="200">
    <h2>Hyperlink</h2>
    <a href="https://www.google.com">
        Visit Google
    </a>
    <h2>Embedded Webpage</h2>
    <iframe
        src="https://www.wikipedia.org"
        width="600"
        height="350">
    </iframe>
</body>
</html>
