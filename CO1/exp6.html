<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>XHTML Web Page</title>
<style type="text/css">
body{
    font-family: Arial, sans-serif;
    background-color: #eef5ff;
    margin: 30px;
}
.container{
    width: 700px;
    margin: auto;
    background-color: white;
    border: 2px solid #4682B4;
    border-radius: 10px;
    padding: 20px;
}
h1{
    color: navy;
    text-align: center;
}
h2{
    color: #00509E;
}
p{
    font-size: 17px;
    line-height: 1.6;
}
hr{
    border: 1px solid #87CEEB;
}
ol{
    background-color: #f8fbff;
    padding: 15px 40px;
    border-left: 5px solid #4682B4;
}
img{
    display: block;
    margin: auto;
    border: 3px solid #4682B4;
    border-radius: 10px;
}
a{
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: white;
    background-color: #00509E;
    padding: 10px;
    border-radius: 5px;
    width: 180px;
    margin-left: auto;
    margin-right: auto;
}
a:hover{
    background-color: #003366;
}
</style>
</head>
<body>
<div class="container">
<h1>Welcome to XHTML</h1>
<p>
This is a simple <b>XHTML-compliant</b> web page demonstrating
proper syntax, ordered lists, images and hyperlinks.
</p>
<hr />
<h2>My Favorite Subjects</h2>
<ol>
<li>Web Technology</li>
<li>Compiler Design</li>
<li>Data Structures</li>
</ol>
<br />
<img src="Swetha_passportsize_photo.jpg"
alt="Student Image"
width="200"
height="200" />
<br />
<a href="https://www.google.com">
Visit Google
</a>
</div>
</body>
</html>
