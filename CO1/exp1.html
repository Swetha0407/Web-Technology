<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef5ff;
            margin: 40px;
        }
        .container {
            background-color: white;
            width: 700px;
            margin: auto;
            padding: 25px;
            border: 2px solid #4682B4;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
            color: navy;
        }
        h2, h3 {
            color: #00509E;
        }
        hr {
            border: 1px solid #87CEEB;
        }
        p {
            font-size: 17px;
            line-height: 1.7;
        }
        b {
            color: darkred;
        }
        i {
            color: green;
        }
        u {
            color: #8B008B;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to HTML</h1>
    <hr>
    <h2>About HTML</h2>
    <p>
        HTML stands for <b>HyperText Markup Language</b>.<br>
        It is used to create <i>web pages</i>.<br>
        HTML is <u>easy to learn</u>.
    </p>
    <hr>
    <h3>Examples</h3>
    <p>
        Water Formula : H<sub>2</sub>O
    </p>
    <p>
        Mathematical Expression : x<sup>2</sup> + y<sup>2</sup>
    </p>
</div>
</body>
</html>
