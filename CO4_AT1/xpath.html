<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>XPath Course Analysis</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .result {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        h3 {
            margin-bottom: 10px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

    </style>

</head>

<body>

<h1>XPath Course Analysis</h1>

<div id="output"></div>

<script>

/* XML Dataset */

const xmlData = `

<?xml version="1.0" encoding="UTF-8"?>

<courses>

    <course id="C101">
        <code>WEB301</code>
        <name>Web Technology</name>
        <faculty>Dr. Arun</faculty>
        <students>58</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C102">
        <code>AI302</code>
        <name>Artificial Intelligence</name>
        <faculty>Dr. Meena</faculty>
        <students>72</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C103">
        <code>WEB303</code>
        <name>Web Technology Laboratory</name>
        <faculty>Dr. Ravi</faculty>
        <students>36</students>
        <credits>2</credits>
        <type>Practical</type>
    </course>

    <course id="C104">
        <code>ML304</code>
        <name>Machine Learning</name>
        <faculty>Dr. Priya</faculty>
        <students>64</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C105">
        <code>DB305</code>
        <name>Database Systems</name>
        <faculty>Dr. Kumar</faculty>
        <students>42</students>
        <credits>3</credits>
        <type>Theory</type>
    </course>

</courses>

`;


/* Convert string into XML document */

const parser = new DOMParser();

const xml = parser.parseFromString(
    xmlData,
    "application/xml"
);


/* Function to execute XPath */

function executeXPath(expression) {

    const result = document.evaluate(

        expression,

        xml,

        null,

        XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,

        null

    );

    let output = "";

    for (
        let i = 0;
        i < result.snapshotLength;
        i++
    ) {

        const node =
            result.snapshotItem(i);

        output +=
            node.textContent.trim() +
            "<br>";

    }

    return output;

}


/* Display all XPath results */

document.getElementById("output").innerHTML = `

<div class="result">

<h3>a. All Course Records</h3>

${executeXPath(
    "/courses/course"
)}

</div>


<div class="result">

<h3>b. Names of All Courses</h3>

${executeXPath(
    "/courses/course/name"
)}

</div>


<div class="result">

<h3>c. Courses Having More Than 50 Students</h3>

${executeXPath(
    "/courses/course[students > 50]/name"
)}

</div>


<div class="result">

<h3>d. Courses Carrying 4 Credits</h3>

${executeXPath(
    "/courses/course[credits = 4]/name"
)}

</div>


<div class="result">

<h3>e. Courses Whose Type is Theory</h3>

${executeXPath(
    "/courses/course[type = 'Theory']/name"
)}

</div>


<div class="result">

<h3>f. Theory Courses Having More Than 50 Students</h3>

${executeXPath(
    "/courses/course[type = 'Theory' and students > 50]/name"
)}

</div>


<div class="result">

<h3>g. Faculty Handling Courses with At Least 4 Credits</h3>

${executeXPath(
    "/courses/course[credits >= 4]/faculty"
)}

</div>


<div class="result">

<h3>h. Course Whose ID is C104</h3>

${executeXPath(
    "/courses/course[@id = 'C104']/name"
)}

</div>


<div class="result">

<h3>i. First Course</h3>

${executeXPath(
    "/courses/course[1]/name"
)}

</div>


<div class="result">

<h3>j. Last Course</h3>

${executeXPath(
    "/courses/course[last()]/name"
)}

</div>

`;

</script>

</body>

</html>
