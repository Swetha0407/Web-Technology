<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>XPath Course Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .result {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .xpath {
            background: #eeeeee;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 12px;
        }

        .answer {
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<h1>XPath Course Analysis</h1>

<div id="output"></div>

<script>

/* XML DATA */

const xmlData = `
<courses>

    <course id="C101">
        <code>WEB301</code>
        <name>Web Technology</name>
        <faculty>Dr. Arun</faculty>
        <students>58</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C102">
        <code>AI302</code>
        <name>Artificial Intelligence</name>
        <faculty>Dr. Meena</faculty>
        <students>72</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C103">
        <code>WEB303</code>
        <name>Web Technology Laboratory</name>
        <faculty>Dr. Ravi</faculty>
        <students>36</students>
        <credits>2</credits>
        <type>Practical</type>
    </course>

    <course id="C104">
        <code>ML304</code>
        <name>Machine Learning</name>
        <faculty>Dr. Priya</faculty>
        <students>64</students>
        <credits>4</credits>
        <type>Theory</type>
    </course>

    <course id="C105">
        <code>DB305</code>
        <name>Database Systems</name>
        <faculty>Dr. Kumar</faculty>
        <students>42</students>
        <credits>3</credits>
        <type>Theory</type>
    </course>

</courses>
`;


/* Convert XML string into XML document */

const parser = new DOMParser();

const xml = parser.parseFromString(
    xmlData,
    "text/xml"
);


/* Check whether XML was parsed correctly */

if (xml.getElementsByTagName("parsererror").length > 0) {

    document.getElementById("output").innerHTML =
        "<h2>Error: XML could not be parsed.</h2>";

}


/* XPath function */

function getXPathResult(expression) {

    const result = document.evaluate(
        expression,
        xml,
        null,
        XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
        null
    );

    let output = "";

    for (let i = 0; i < result.snapshotLength; i++) {

        const node = result.snapshotItem(i);

        /*
         * If the selected node is a course,
         * display its important information.
         */

        if (node.nodeName === "course") {

            const id = node.getAttribute("id");
            const code = node.getElementsByTagName("code")[0].textContent;
            const name = node.getElementsByTagName("name")[0].textContent;
            const faculty = node.getElementsByTagName("faculty")[0].textContent;
            const students = node.getElementsByTagName("students")[0].textContent;
            const credits = node.getElementsByTagName("credits")[0].textContent;
            const type = node.getElementsByTagName("type")[0].textContent;

            output +=
                "ID: " + id +
                " | Code: " + code +
                " | Name: " + name +
                " | Faculty: " + faculty +
                " | Students: " + students +
                " | Credits: " + credits +
                " | Type: " + type +
                "<br>";

        }

        else {

            output += node.textContent.trim() + "<br>";

        }

    }

    return output;
}


/* Display all XPath questions */

document.getElementById("output").innerHTML = `

<div class="result">

    <h2>a. All Course Records</h2>

    <div class="xpath">
        /courses/course
    </div>

    <div class="answer">
        ${getXPathResult("/courses/course")}
    </div>

</div>


<div class="result">

    <h2>b. Names of All Courses</h2>

    <div class="xpath">
        /courses/course/name
    </div>

    <div class="answer">
        ${getXPathResult("/courses/course/name")}
    </div>

</div>


<div class="result">

    <h2>c. Courses Having More Than 50 Students</h2>

    <div class="xpath">
        /courses/course[students &gt; 50]
    </div>

    <div class="answer">
        ${getXPathResult("/courses/course[students > 50]/name")}
    </div>

</div>


<div class="result">

    <h2>d. Courses Carrying 4 Credits</h2>

    <div class="xpath">
        /courses/course[credits = 4]
    </div>

    <div class="answer">
        ${getXPathResult("/courses/course[credits = 4]/name")}
    </div>

</div>


<div class="result">

    <h2>e. Courses Whose Type is Theory</h2>

    <div class="xpath">
        /courses/course[type = 'Theory']
    </div>

    <div class="answer">
        ${getXPathResult("/courses/course[type = 'Theory']/name")}
    </div>

</div>


<div class="result">

    <h2>f. Theory Courses Having More Than 50 Students</h2>

    <div class="xpath">
        /courses/course[type = 'Theory' and students &gt; 50]/name
    </div>

    <div class="answer">
        ${getXPathResult(
            "/courses/course[type = 'Theory' and students > 50]/name"
        )}
    </div>

</div>


<div class="result">

    <h2>g. Faculty Handling Courses with At Least 4 Credits</h2>

    <div class="xpath">
        /courses/course[credits &gt;= 4]/faculty
    </div>

    <div class="answer">
        ${getXPathResult(
            "/courses/course[credits >= 4]/faculty"
        )}
    </div>

</div>


<div class="result">

    <h2>h. Course Whose ID is C104</h2>

    <div class="xpath">
        /courses/course[@id = 'C104']/name
    </div>

    <div class="answer">
        ${getXPathResult(
            "/courses/course[@id = 'C104']/name"
        )}
    </div>

</div>


<div class="result">

    <h2>i. First Course</h2>

    <div class="xpath">
        /courses/course[1]/name
    </div>

    <div class="answer">
        ${getXPathResult(
            "/courses/course[1]/name"
        )}
    </div>

</div>


<div class="result">

    <h2>j. Last Course</h2>

    <div class="xpath">
        /courses/course[last()]/name
    </div>

    <div class="answer">
        ${getXPathResult(
            "/courses/course[last()]/name"
        )}
    </div>

</div>

`;

</script>

</body>
</html>
